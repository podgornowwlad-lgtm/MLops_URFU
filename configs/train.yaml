# Конфиг эксперимента: всё, что в ноутбуке Case_1 было зашито в ячейки.
# Схема проверяется pydantic-моделью bank_churn.config.ExperimentConfig —
# опечатка в ключе или неверный тип остановит запуск с понятной ошибкой.

seed: 42

columns:
  target: Exited
  # Технический id строки, id клиента и фамилия (ПДн) — в модель не идут.
  ids: [id, CustomerId, Surname]
  numeric: [CreditScore, Age, Tenure, Balance, EstimatedSalary, NumOfProducts]
  binary: [HasCrCard, IsActiveMember]
  categorical: [Geography, Gender]

validation:
  test_size: 0.2
  split_seed: 42
  n_splits: 3
  cv_seed: 52
  # Ключевая метрика — recall: дешёвое удержание, дорогая потеря клиента,
  # поэтому важно найти как можно больше уходящих клиентов.
  metric: recall

# Отбор моделей (`bank-churn compare`): GridSearchCV по каждому кандидату.
candidates:
  logreg:
    poly__degree: [1, 2]
    model__C: [0.001, 0.01, 0.1, 1]
    model__penalty: [elasticnet]
    model__solver: [saga]
    model__l1_ratio: [0, 0.25, 0.5, 0.75, 1]
    model__class_weight: [balanced, null]
  decision_tree:
    model__max_depth: [3, 5, 7, 10, 20]
    model__min_samples_split: [2, 5, 10, 20]
    model__min_samples_leaf: [1, 2, 5, 10]
    model__class_weight: [balanced, null]
  random_forest:
    model__n_estimators: [100, 200, 500]
    model__max_depth: [3, 5, 7]
    model__min_samples_split: [2, 4, 10]
    model__min_samples_leaf: [1, 2, 5]
    model__class_weight: [balanced]
  catboost:
    model__iterations: [100, 200, 500]
    model__depth: [3, 5, 7]
    model__l2_leaf_reg: [3, 5, 7]
    model__auto_class_weights: [Balanced, SqrtBalanced]

# Финальная модель (`bank-churn train`): CatBoost + Optuna.
# CatBoost выбран по итогам сравнения: recall на уровне лучших при быстром обучении.
tuning:
  model: catboost
  # По SHAP и feature importance вклад этих признаков минимален; без них
  # recall на тесте не упал, а модель стала проще.
  excluded_features: [HasCrCard, EstimatedSalary, Tenure]
  n_trials: 20
  timeout_sec: 3600
  threshold: 0.5
  search_space:
    model__iterations: {kind: int, low: 100, high: 1000, step: 100}
    model__depth: {kind: int, low: 4, high: 10, step: 2}
    model__l2_leaf_reg: {kind: int, low: 2, high: 10, step: 2}
    model__auto_class_weights: {kind: categorical, choices: [Balanced, SqrtBalanced]}
